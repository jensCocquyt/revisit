name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Format and lint (Biome)
        run: npm run lint
      - name: Unit tests
        run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  stack:
    runs-on: ubuntu-latest
    needs: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: API health endpoint responds
        run: curl -fsS http://localhost:3000/health
      - name: Stub enricher produces a contract-valid result in the container
        run: docker compose exec -T worker uv run --no-sync python -m worker.smoke
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
