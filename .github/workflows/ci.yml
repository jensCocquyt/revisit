name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Format and lint (Biome)
        run: npm run lint
      - name: Unit tests
        run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: API health endpoint responds
        run: curl -fsS http://localhost:3000/health
      - name: Stub enricher produces a contract-valid result in the container
        run: |
          docker compose exec -T worker uv run --no-sync python - <<'EOF'
          import json
          import pathlib

          from worker.contract import validation_errors
          from worker.enricher import EnrichmentInput, StubEnricher

          fixture = json.loads(
              pathlib.Path("/app/contracts/enrichment/fixtures/valid-revisit.json").read_text()
          )
          assert validation_errors(fixture) == [], "shared fixture must be contract-valid"

          outcome = StubEnricher().enrich(EnrichmentInput(content="CI smoke content"))
          errors = validation_errors(outcome.result)
          assert errors == [], errors
          print("stub smoke ok")
          EOF
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
