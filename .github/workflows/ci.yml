name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revisit
          POSTGRES_PASSWORD: revisit
          POSTGRES_DB: revisit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revisit -d revisit"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://revisit:revisit@localhost:5432/revisit?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Apply migrations
        working-directory: ${{ github.workspace }}
        run: >-
          docker run --rm --network host -v "$PWD/db:/db" -e DATABASE_URL
          ghcr.io/amacneil/dbmate:2 --no-dump-schema up
      - run: npm ci
      - name: Format and lint (Biome)
        run: npm run lint
      - name: Unit and integration tests
        run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  stack:
    runs-on: ubuntu-latest
    needs: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: API health endpoint responds
        run: curl -fsS http://localhost:3000/health
      - name: Stub enricher produces a contract-valid result in the container
        run: docker compose exec -T worker uv run --no-sync python -m worker.smoke
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
