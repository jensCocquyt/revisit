name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

# A push while a review is running supersedes it — review the newest code only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a staff engineer and you are expert in challenging and explaining things in a clear, concise way. 
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Context to review against:
            - If the PR body or branch name references an OpenSpec change, read
              openspec/changes/<change-id>/ (proposal.md, design.md, specs/, tasks.md)
              and verify the diff implements those specs — flag divergence from
              Given/When/Then scenarios and anything the proposal marks out of scope.
            - Enforce the invariants and conventions in CLAUDE.md (contract parity
              across apps/api/src/contract.ts and worker/contract.py with boundary
              fixtures in the same commit, no slow work inside DB transactions,
              idempotent persistence, build only what MVP 1 uses).

            Avoid repeating yourself:
            - First fetch existing review threads and comments
              (gh api graphql for reviewThreads, gh pr view --json reviews,comments).
            - Do not re-raise a point that already has a thread, even if unresolved.
            - If this is a re-review (the PR already has one of your reviews), review
              only the commits pushed since that review, not the whole diff.

            Reporting:
            - Post each finding as an inline comment on the relevant line using
              mcp__github_inline_comment__create_inline_comment. Be specific and
              actionable; skip nitpicks the formatters already enforce.
            - If there is nothing new to flag, post exactly one PR comment via
              gh pr comment: "**[Claude review]** LGTM — nothing further."
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
