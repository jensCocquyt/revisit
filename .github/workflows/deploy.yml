name: Deploy

# Manual dispatch only, never a required check. Assumes the scoped deploy role
# via GitHub OIDC (created by terraform/bootstrap — see docs/runbook.md), so
# no long-lived AWS keys exist anywhere. Apply: build and push SHA-tagged
# images, terraform apply, run migrations as a one-off ECS task, wait for
# stable services, print the URL. Dispatch with destroy=true to tear the
# environment down instead.
on:
  workflow_dispatch:
    inputs:
      destroy:
        description: Destroy the demo environment instead of deploying
        required: false
        default: false
        type: boolean
      operator_cidr:
        description: CIDR allowed to reach RDS on 5432 for runbook recovery (e.g. 203.0.113.7/32)
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require the deploy prerequisites
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' || vars.TF_STATE_BUCKET == '' || vars.BEDROCK_MODEL_ID == '' }}
        run: |
          echo "::error::Missing repository variables. Apply terraform/bootstrap first (docs/runbook.md, section 'Bootstrap and deploy role'), then set AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, and BEDROCK_MODEL_ID."
          exit 1

      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: ${{ !inputs.destroy }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        if: ${{ !inputs.destroy }}
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: ./scripts/deploy-build-push.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper garbles `terraform output -raw` capture.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/stack
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform apply
        if: ${{ !inputs.destroy }}
        working-directory: terraform/stack
        env:
          # Free-form dispatch input: passed as an environment variable, never
          # interpolated into the script text (script-injection hardening).
          OPERATOR_CIDR: ${{ inputs.operator_cidr }}
        run: >-
          terraform apply -auto-approve -input=false
          -var "image_tag=$GITHUB_SHA"
          -var "bedrock_model_id=${{ vars.BEDROCK_MODEL_ID }}"
          -var "operator_cidr=$OPERATOR_CIDR"

      - name: Run migrations as a one-off ECS task
        if: ${{ !inputs.destroy }}
        working-directory: terraform/stack
        run: ../../scripts/deploy-migrate.sh

      - name: Wait for stable services and print the URL
        if: ${{ !inputs.destroy }}
        working-directory: terraform/stack
        run: ../../scripts/deploy-wait.sh

      - name: Terraform destroy
        if: ${{ inputs.destroy }}
        working-directory: terraform/stack
        run: >-
          terraform destroy -auto-approve -input=false
          -var "image_tag=unused"
          -var "bedrock_model_id=unused"
          -var "operator_cidr="
