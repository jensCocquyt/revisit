[project]
name = "revisit-worker"
version = "0.1.0"
description = "Revisit enrichment worker"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "trafilatura>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
