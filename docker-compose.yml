name: revisit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revisit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revisit}
      POSTGRES_DB: ${POSTGRES_DB:-revisit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revisit} -d ${POSTGRES_DB:-revisit}"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-revisit}:${POSTGRES_PASSWORD:-revisit}@postgres:5432/${POSTGRES_DB:-revisit}?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: --no-dump-schema up

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-revisit}:${POSTGRES_PASSWORD:-revisit}@postgres:5432/${POSTGRES_DB:-revisit}?sslmode=disable
      API_PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-revisit}:${POSTGRES_PASSWORD:-revisit}@postgres:5432/${POSTGRES_DB:-revisit}?sslmode=disable
      ENRICHER: ${ENRICHER:-stub}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      FETCH_MAX_REDIRECTS: ${FETCH_MAX_REDIRECTS:-5}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-2000000}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-15}
      FETCH_ALLOWED_CONTENT_TYPES: ${FETCH_ALLOWED_CONTENT_TYPES:-text/html,application/xhtml+xml,text/plain}
      FETCH_ALLOWED_HOSTS: ${FETCH_ALLOWED_HOSTS:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-m", "worker.healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # CI-only static page for the offline save -> enriched stack check: gives the
  # worker a real HTML page to fetch without leaving the compose network.
  # Started only with `docker compose --profile ci up`.
  fixture:
    image: nginx:1.27-alpine
    profiles: ["ci"]
    volumes:
      - ./apps/worker/tests/fixtures/article.html:/usr/share/nginx/html/index.html:ro

volumes:
  pgdata:
